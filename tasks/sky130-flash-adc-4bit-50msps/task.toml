schema_version = "1.3"
artifacts = ["/app/circuit.spi"]

[task]
name = "analog-arena/sky130-flash-adc-4bit-50msps"
description = "Design a Sky130 4-bit 50 MS/s differential flash ADC with no conversion errors or missing codes, at most 0.5 LSB INL and DNL, at least 22 dB SNDR and 26 dB SFDR, and at most 5 mW drawn from all external sources."
authors = [{ name = "Kezhuo Liu" }]

[metadata]
category = "Hardware, Embedded, and Low-Level Systems"
subcategory = "Analog and mixed-signal circuit design"
task_objective = ["Implement"]
artifact_type = ["Hardware or firmware artifact"]

[agent]
timeout_sec = 7200.0
user = "agent"

[verifier]
timeout_sec = 3600.0
user = "root"
environment_mode = "separate"

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 900.0
cpus = 4
memory_mb = 8192
storage_mb = 10240

[environment]
network_mode = "no-network"
build_timeout_sec = 900.0
cpus = 4
memory_mb = 8192
storage_mb = 10240
workdir = "/app"
