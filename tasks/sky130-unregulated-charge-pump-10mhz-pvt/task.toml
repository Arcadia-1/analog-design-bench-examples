schema_version = "1.3"
artifacts = ["/app/circuit.spi"]

[task]
name = "analog-arena/sky130-unregulated-charge-pump-10mhz-pvt"
description = "Design a Sky130 unregulated charge pump that holds a 2.2-2.8 V output under a 40-50 uA load with at most 5 mVpp ripple, 200 uA enabled and 100 nA disabled supply current, powered only from its supply."
authors = [{ name = "Ying Haochi" }]

[metadata]
category = "Hardware, Embedded, and Low-Level Systems"
subcategory = "Analog and mixed-signal circuit design"
task_objective = ["Implement"]
artifact_type = ["Hardware or firmware artifact"]

[agent]
timeout_sec = 7200.0
user = "agent"

[verifier]
timeout_sec = 3600.0
user = "root"
environment_mode = "separate"

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 900.0
cpus = 4
memory_mb = 8192
storage_mb = 10240

[environment]
network_mode = "no-network"
build_timeout_sec = 900.0
cpus = 4
memory_mb = 8192
storage_mb = 10240
workdir = "/app"
