schema_version = "1.3"
artifacts = ["/app/circuit.sim"]

[task]
name = "analog-arena/ihp-sg13g2-hbt-bandgap-reference-pvt-vacask"
description = "Design an IHP SG13G2 SiGe-HBT bandgap voltage reference with enable, written as a VACASK netlist, that holds 1.00 V to 1.15 V within 100 ppm/C over -40 C to 125 C, meets line, load, supply-rejection, noise and current limits, and starts up cleanly, across PVT."
authors = [{ name = "Token Zhang" }]

[metadata]
category = "Hardware, Embedded, and Low-Level Systems"
subcategory = "Analog and mixed-signal circuit design"
task_objective = ["Implement"]
artifact_type = ["Hardware or firmware artifact"]

[agent]
timeout_sec = 7200.0
user = "agent"

[verifier]
timeout_sec = 3600.0
user = "root"
environment_mode = "separate"

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 900.0
cpus = 4
memory_mb = 8192
storage_mb = 10240

[environment]
network_mode = "no-network"
build_timeout_sec = 900.0
cpus = 4
memory_mb = 8192
storage_mb = 10240
workdir = "/app"
