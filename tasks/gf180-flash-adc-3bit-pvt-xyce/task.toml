schema_version = "1.3"
artifacts = ["/app/circuit.spi"]

[task]
name = "analog-arena/gf180-flash-adc-3bit-pvt-xyce"
description = "Design a GF180MCU 3-bit 50 MS/s flash ADC, simulated with Xyce, that converts every code with thresholds within 0.3 LSB, clamps out-of-range inputs, settles its outputs 3 ns after the clock edge, reaches 22 dB SNDR at 3.1 MHz and 19 dB at 23.4 MHz and draws at most 2.5 mW from all pins, at representative PVT points."
authors = [{ name = "Shixuan Wang" }]

[metadata]
category = "Hardware, Embedded, and Low-Level Systems"
subcategory = "Analog and mixed-signal circuit design"
task_objective = ["Implement"]
artifact_type = ["Hardware or firmware artifact"]

[agent]
timeout_sec = 7200.0
user = "agent"

[verifier]
timeout_sec = 3600.0
user = "root"
environment_mode = "separate"

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 900.0
cpus = 4
memory_mb = 8192
storage_mb = 10240

[environment]
network_mode = "no-network"
build_timeout_sec = 900.0
cpus = 4
memory_mb = 8192
storage_mb = 10240
workdir = "/app"
