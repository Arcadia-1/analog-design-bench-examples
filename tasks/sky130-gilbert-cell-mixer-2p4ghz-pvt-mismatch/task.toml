schema_version = "1.3"
artifacts = ["/app/circuit.spi"]

[task]
name = "analog-arena/sky130-gilbert-cell-mixer-2p4ghz-pvt-mismatch"
description = "Design a Sky130 double-balanced Gilbert-cell mixer for 2.3-2.5 GHz RF to a 200 MHz IF with at least 3 dB conversion gain, at most -45 dB port isolation, at most -30 dBc spurs, at least -2 dBm IIP3, at most 1 dB compression at 80 mV, at most 2 mW and at most 10 uW into each RF and LO pin, across PVT, drive, imbalance and mismatch."
authors = [{ name = "Zhishuai Zhang" }]

[metadata]
category = "Hardware, Embedded, and Low-Level Systems"
subcategory = "Analog and mixed-signal circuit design"
task_objective = ["Implement"]
artifact_type = ["Hardware or firmware artifact"]

[agent]
timeout_sec = 7200.0
user = "agent"

[verifier]
timeout_sec = 3600.0
user = "root"
environment_mode = "separate"

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 900.0
cpus = 4
memory_mb = 8192
storage_mb = 10240

[environment]
network_mode = "no-network"
build_timeout_sec = 900.0
cpus = 4
memory_mb = 8192
storage_mb = 10240
workdir = "/app"
