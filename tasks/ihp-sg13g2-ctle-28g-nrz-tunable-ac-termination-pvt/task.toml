schema_version = "1.3"
artifacts = ["/app/circuit.spi"]

[task]
name = "analog-arena/ihp-sg13g2-ctle-28g-nrz-tunable-ac-termination-pvt"
description = "Design an IHP SG13G2 (SiGe BiCMOS, 3.3 V) fully differential CTLE for a 28 Gb/s NRZ receiver: a DC-coupled 50 ohm input (the link AC-couples it off-die) matched to -15 dB return loss up to 14 GHz, 2-bit gain (-12 to -6 dB) and peak (0 to +6 dB at 14 GHz) codes each within 1.5 dB, a non-inverting response with at least 25 GHz of -3 dB bandwidth above Nyquist, stable vocm-tracking bias and at most 60 mW, across process, supply, 0-125 C and output load."
authors = [{ name = "Mingtao Zhan" }]

[metadata]
category = "Hardware, Embedded, and Low-Level Systems"
subcategory = "Analog and mixed-signal circuit design"
task_objective = ["Implement"]
artifact_type = ["Hardware or firmware artifact"]

