schema_version = "1.3"
artifacts = ["/app/circuit.spi"]

[task]
name = "analog-arena/sky130-fd-3stage-nested-miller-opamp"
description = "Design a Sky130 fully differential three-stage nested-Miller op amp with CMFB that reaches 70 dB gain, 5 MHz unity-gain frequency and 60 degrees of phase margin across PVT and meets op-amp signoff limits on swing, rejection, noise, distortion, slew, settling, offset and current."
authors = [{ name = "Token Zhang" }]

[metadata]
category = "Hardware, Embedded, and Low-Level Systems"
subcategory = "Analog and mixed-signal circuit design"
task_objective = ["Implement"]
artifact_type = ["Hardware or firmware artifact"]

[agent]
timeout_sec = 7200.0
user = "agent"

[verifier]
timeout_sec = 3600.0
user = "root"
environment_mode = "separate"

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 900.0
cpus = 4
memory_mb = 8192
storage_mb = 10240

[environment]
