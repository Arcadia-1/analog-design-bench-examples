schema_version = "1.3"
artifacts = ["/app/circuit.spi"]

[task]
name = "analog-arena/sky130-flash-adc-3bit-pvt"
description = "Design a Sky130 3-bit 50 MS/s flash ADC whose thresholds stay within 0.3 LSB, with outputs settled 9.5 ns after the clock edge, at least 22 dB SNDR and 24.5 dB SFDR and at most 1 mW from all pins, across PVT."
authors = [{ name = "Shixuan Wang" }]

[metadata]
category = "Hardware, Embedded, and Low-Level Systems"
subcategory = "Analog and mixed-signal circuit design"
task_objective = ["Implement"]
artifact_type = ["Hardware or firmware artifact"]

[agent]
timeout_sec = 7200.0
user = "agent"

[verifier]
timeout_sec = 3600.0
user = "root"
environment_mode = "separate"

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 900.0
cpus = 4
memory_mb = 8192
storage_mb = 10240

[environment]
network_mode = "no-network"
build_timeout_sec = 900.0
cpus = 4
memory_mb = 8192
storage_mb = 10240
workdir = "/app"
