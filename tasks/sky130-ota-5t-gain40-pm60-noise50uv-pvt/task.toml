schema_version = "1.3"
artifacts = ["/app/circuit.spi"]

[task]
name = "analog-arena/sky130-ota-5t-gain40-pm60-noise50uv-pvt"
description = "Design a Sky130 current-biased five-transistor OTA with at least 40 dB loop gain, 100 MHz unity-gain bandwidth and 60 degrees phase margin, at most 50 uVrms input noise and 0.5 mW, across PVT and a +/-10 % reference current."
authors = [{ name = "Suyang Song" }]

[metadata]
category = "Hardware, Embedded, and Low-Level Systems"
subcategory = "Analog and mixed-signal circuit design"
task_objective = ["Implement"]
artifact_type = ["Hardware or firmware artifact"]

[agent]
timeout_sec = 7200.0
user = "agent"

[verifier]
timeout_sec = 3600.0
user = "root"
environment_mode = "separate"

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 900.0
cpus = 4
memory_mb = 8192
storage_mb = 10240

[environment]
